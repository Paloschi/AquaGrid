# AquaGrid example config (see README.md). Every key run_from_config reads.
climate: data/climate.zarr       # (time, y, x): tmin, tmax, precip, eto
sowing: data/sowing.zarr         # (y, x) int32 YYYYDDD; <=0 = not simulated
sowing_var: sowing               # variable name in the sowing store
initial_water_content: FC       # FC | WP | SAT, either soil mode
output: data/output.zarr

crop:
  name: Maize                    # any AquaCrop-OSPy crop
  zarr: null                     # optional (param, y, x) cube; null skips it
soil:
  name: SandyLoam                # preset; remove when zarr is a path
  zarr: null                     # hydraulic or texture raster; null uses name
  ksat_unit: cm/d                # float hydraulic Ksat: cm/d or mm/d
  scale_factors: {}              # hydraulic only, e.g. {ksat: 10}; else ignored
irrigation:
  method: 0                      # 0 rainfed | 1 SMT | 2 interval | 3 schedule | 4 net | 5 depth
  wet_surf: 100                  # soil surface wetted by irrigation (%)
  app_eff: 100                   # application efficiency (%)
  max_irr: 25                    # maximum depth per day (mm)
  max_irr_season: 10000          # seasonal cap (mm); method 4 ignores it
  smt: [100, 100, 100, 100]      # method 1, % of TAW in four stages
  interval: 3                    # method 2, days between events
  net_irr_smt: 80                # method 4, % of TAW to maintain
  depth: 0                       # method 5, mm applied every day
  schedule: null                 # method 3 depth zarr (time, y, x); null skips it
  zarr: null                     # optional (param, y, x) cube; null skips it
field:
  bunds: false                   # pond rain behind bunds; curve-number runoff stays off
  z_bund: 0                      # bund height (m); the kernel stores millimetres
  bund_water: 0                  # initial water in the bunds (mm), capped at the height
  mulches: false                 # reduce soil evaporation where the surface is dry
  mulch_pct: 50                  # percent of the surface covered by mulch
  f_mulch: 0.5                   # evaporation reduction factor of the mulch
  sr_inhb: false                 # inhibit curve-number runoff
  curve_number_adj_pct: 0        # percent shift applied before antecedent moisture

backend: cpu                     # cpu | gpu
options:
  save_daily: false
  tile: 128                      # pixels on each side of a tile
  parallel: true                 # CPU thread per pixel; GPU ignores this
  evap_time_steps: 20            # soil-evaporation substeps per day
  max_season_days: 400           # cap; reaching it records status 0
