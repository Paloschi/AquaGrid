# AquaGrid example config (see README.md)
climate: data/climate.zarr
sowing: data/sowing.zarr
output: data/output.zarr

crop:
  name: Maize
soil:
  name: SandyLoam          # AquaCrop preset (one profile for the grid)
  # zarr: data/soil.zarr   # alternative: hydraulic or texture raster
  # ksat_unit: cm/d        # default in zarr mode (HiHydroSoil)

backend: cpu          # cpu | gpu
options:
  save_daily: false
  tile: 128
  parallel: true
  max_season_days: 400
