[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aquacrop-grid"
version = "0.1.0"
description = "AquaCrop on rasters: zarr in/out, Numba-compiled kernels (CPU/GPU)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rennan Andres Paloschi" }]
keywords = ["aquacrop", "raster", "zarr", "numba", "crop", "hydrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "pandas>=2.0",
    "xarray>=2024.1",
    "zarr>=2.16",
    "dask>=2024.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "aquacrop>=3.0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Paloschi/aquacrop-grid"
Issues = "https://github.com/Paloschi/aquacrop-grid/issues"
Changelog = "https://github.com/Paloschi/aquacrop-grid/blob/main/CHANGELOG.md"
Source = "https://github.com/Paloschi/aquacrop-grid"

[project.scripts]
aquacrop-grid = "aquacrop_grid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
