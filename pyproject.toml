[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aquagrid"
version = "0.2.0"
description = "AquaCrop on rasters: zarr in/out, Numba-compiled kernels (CPU/GPU)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rennan Andres Paloschi" }]
keywords = ["aquacrop", "raster", "zarr", "numba", "crop", "hydrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Lower bounds are install floors, not a tested matrix. CI (Ubuntu and
# Windows, Python 3.11 / 3.12) installs the newest versions that satisfy
# these specifiers.
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "pandas>=2.0",
    "xarray>=2024.1",
    "zarr>=2.16,<3",
    "dask>=2024.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "aquacrop>=3.0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Paloschi/aquagrid"
Issues = "https://github.com/Paloschi/aquagrid/issues"
Changelog = "https://github.com/Paloschi/aquagrid/blob/main/CHANGELOG.md"
Source = "https://github.com/Paloschi/aquagrid"

[project.scripts]
aquagrid = "aquagrid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
