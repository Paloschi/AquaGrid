name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          expected="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "${expected}"

      - name: Write release notes from the changelog
        run: |
          python - << 'PY'
          import pathlib, re, tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              flags=re.M | re.S,
          )
          if match is None or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no notes for {version}")
          pathlib.Path("release-notes.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Install build and twine
        run: python -m pip install --user build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aquagrid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign and upload GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --repo "${repo}" --clobber
            gh release edit "${tag}" --repo "${repo}" --notes-file release-notes.md
          else
            gh release create "${tag}" \
              --repo "${repo}" \
              --title "${tag}" \
              --notes-file release-notes.md \
              dist/*
          fi
